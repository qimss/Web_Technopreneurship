<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technopreneurship — Peta Perkuliahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --blueprint: #10233d;
    --blueprint-deep: #0a1a2e;
    --grid-line: rgba(233, 241, 250, 0.07);
    --brass: #d99a3d;
    --brass-bright: #f0b04e;
    --paper: #f3efe4;
    --paper-shadow: rgba(10, 26, 46, 0.35);
    --ink: #1c2a3a;
    --ink-soft: #4a5568;
    --rule: rgba(28, 42, 58, 0.14);
    --done: #4d7c5f;
    --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
    --font-body: 'Source Serif 4', Georgia, serif;
  }

  :root:not([data-theme="light"]) {
    /* dark stays close to native design — already low-key */
  }

  :root[data-theme="dark"] {
    --paper: #1a2332;
    --paper-shadow: rgba(0,0,0,0.5);
    --ink: #e8e4d8;
    --ink-soft: #a8b0bd;
    --rule: rgba(232, 228, 216, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--blueprint-deep);
    font-family: var(--font-body);
    color: var(--ink);
  }

  body {
    display: flex;
    min-height: 100vh;
  }

  a { color: inherit; }

  ::selection { background: var(--brass); color: var(--blueprint-deep); }

  /* ---------- Sidebar: blueprint roadmap ---------- */
  .sidebar {
    width: 320px;
    flex-shrink: 0;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      var(--blueprint);
    background-size: 24px 24px;
    color: #eaf0f8;
    padding: 36px 22px 40px;
    overflow-y: auto;
    position: sticky;
    top: 0;
    height: 100vh;
    border-right: 1px solid rgba(233,241,250,0.08);
  }

  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1.15;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .brand span { color: var(--brass-bright); }

  .brand-sub {
    font-size: 0.85rem;
    color: rgba(233,241,250,0.55);
    margin: 0 0 28px;
    font-family: var(--font-display);
  }

  .progress-block {
    margin-bottom: 30px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-display);
    font-size: 0.78rem;
    color: rgba(233,241,250,0.65);
    margin-bottom: 8px;
  }
  .progress-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(233,241,250,0.12);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--brass-bright);
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .roadmap {
    position: relative;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .roadmap::before {
    content: '';
    position: absolute;
    left: 15px;
    top: 8px;
    bottom: 8px;
    width: 1px;
    background: rgba(233,241,250,0.18);
  }

  .roadmap li { position: relative; }

  .node-btn {
    all: unset;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 9px 6px 9px 0;
    cursor: pointer;
    border-radius: 6px;
  }
  .node-btn:hover { background: rgba(233,241,250,0.05); }
  .node-btn:focus-visible {
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }

  .node-marker {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid rgba(233,241,250,0.35);
    background: var(--blueprint-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(233,241,250,0.75);
    position: relative;
    z-index: 1;
  }
  .node-btn.active .node-marker {
    border-color: var(--brass-bright);
    background: var(--brass-bright);
    color: var(--blueprint-deep);
  }
  .node-btn.done .node-marker {
    border-color: var(--done);
    background: var(--done);
    color: #eaf0f8;
  }
  .node-btn.done .node-marker::after {
    content: '✓';
  }
  .node-btn.done.active .node-marker::after { content: attr(data-num); }

  .node-text {
    font-family: var(--font-display);
    font-size: 0.86rem;
    line-height: 1.3;
    color: rgba(233,241,250,0.88);
    text-align: left;
  }
  .node-btn.active .node-text { color: #fff; font-weight: 600; }
  .node-tag {
    display: block;
    font-size: 0.7rem;
    color: rgba(233,241,250,0.45);
    margin-top: 2px;
  }

  /* ---------- Main content: notebook page ---------- */
  .main {
    flex: 1;
    min-width: 0;
    background: var(--blueprint-deep);
    padding: 48px clamp(20px, 5vw, 72px);
    display: flex;
    justify-content: center;
  }

  .page {
    background: var(--paper);
    color: var(--ink);
    width: 100%;
    max-width: 760px;
    border-radius: 3px;
    box-shadow: 0 30px 60px -20px var(--paper-shadow);
    padding: clamp(28px, 5vw, 60px);
    min-height: 70vh;
  }

  .page-eyebrow {
    font-family: var(--font-display);
    font-size: 0.8rem;
    color: var(--brass);
    margin: 0 0 10px;
  }

  .page-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.6rem, 3vw, 2.3rem);
    line-height: 1.2;
    margin: 0 0 22px;
    letter-spacing: -0.01em;
  }

  .page-body {
    font-size: 1.08rem;
    line-height: 1.75;
    max-width: 68ch;
  }
  .page-body p { margin: 0 0 1.1em; }
  .page-body ul { margin: 0 0 1.3em; padding-left: 1.3em; }
  .page-body li { margin-bottom: 0.5em; }

  .term-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin: 24px 0 30px;
  }
  @media (max-width: 620px) {
    .term-cards { grid-template-columns: 1fr; }
  }
  .term-card {
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 18px 20px;
  }
  .term-card h3 {
    font-family: var(--font-display);
    font-size: 1.02rem;
    margin: 0 0 8px;
  }
  .term-card.a { border-left: 3px solid var(--ink-soft); }
  .term-card.b { border-left: 3px solid var(--brass); }
  .term-card p { font-size: 0.98rem; margin: 0; }

  .divider {
    border: none;
    border-top: 1px dashed var(--rule);
    margin: 30px 0;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    flex-wrap: wrap;
    gap: 14px;
  }

  .done-toggle {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-size: 0.9rem;
    background: transparent;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  .done-toggle:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .done-toggle.is-done {
    background: var(--done);
    border-color: var(--done);
    color: #fff;
  }
  .checkbox-dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid currentColor;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px;
  }

  .nav-arrows { display: flex; gap: 10px; }
  .nav-btn {
    font-family: var(--font-display);
    font-size: 0.85rem;
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .mobile-toggle {
    display: none;
  }

  @media (max-width: 880px) {
    body { flex-direction: column; }
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
      padding: 20px 20px 8px;
    }
    .sidebar.collapsed .roadmap,
    .sidebar.collapsed .progress-block { display: none; }
    .mobile-toggle {
      display: block;
      all: unset;
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--brass-bright);
      margin-bottom: 8px;
      cursor: pointer;
    }
    .main { padding: 28px 16px 48px; }
  }

  .credit {
    text-align: center;
    font-family: var(--font-display);
    font-size: 0.72rem;
    color: rgba(233,241,250,0.3);
    margin-top: 24px;
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <p class="brand">Techno<span>preneurship</span></p>
  <p class="brand-sub">Peta 16 Pertemuan</p>
  <button class="mobile-toggle" id="mobileToggle">☰ Lihat daftar pertemuan</button>

  <div class="progress-block">
    <div class="progress-label"><span>Progres belajar</span><span id="progressText">0 / 16</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <ul class="roadmap" id="roadmap"></ul>
  <p class="credit">Materi dapat disesuaikan oleh pengajar</p>
</aside>

<main class="main">
  <article class="page" id="page">
    <!-- filled by JS -->
  </article>
</main>

<script>
(function () {
  const MEETINGS = [
    {
      title: "Pengantar Entrepreneurship & Technopreneurship",
      tag: "Konsep Dasar",
      body: () => `
        <p>Pertemuan pembuka ini meletakkan dasar untuk memahami dua istilah yang sering tertukar: <strong>entrepreneurship</strong> dan <strong>technopreneurship</strong>.</p>
        <div class="term-cards">
          <div class="term-card a">
            <h3>Entrepreneurship</h3>
            <p>Proses mengenali peluang, menciptakan nilai, dan mengubah ide menjadi solusi yang bermanfaat bagi orang lain maupun pasar.</p>
          </div>
          <div class="term-card b">
            <h3>Technopreneurship</h3>
            <p>Pada dasarnya proses yang sama — mengenali peluang, menciptakan nilai, dan mengubah ide menjadi solusi bermanfaat — namun dijalankan dengan memanfaatkan teknologi.</p>
          </div>
        </div>
        <p><strong>Catatan penting:</strong> "memanfaatkan teknologi" di sini tidak berarti harus membuat kode atau program. Teknologi dipakai secara lebih luas, yaitu sebagai alat untuk mempermudah jalannya proses bisnis, usaha, atau wirausaha — mulai dari cara berjualan, mengelola pelanggan, memproduksi barang, sampai memasarkan produk.</p>
        <ul>
          <li>Entrepreneurship = inti dari berwirausaha: peka terhadap peluang dan berani mengeksekusi ide.</li>
          <li>Technopreneurship = entrepreneurship yang mengintegrasikan teknologi sebagai enabler, bukan sekadar identitas "startup teknologi".</li>
          <li>Contoh sederhana: pedagang keripik yang mulai mencatat stok dan pesanan lewat aplikasi kasir digital sudah menjalankan technopreneurship, walau ia tidak menulis satu baris kode pun.</li>
        </ul>
        <hr class="divider">
        <p>Pertanyaan reflektif untuk didiskusikan di kelas: teknologi apa yang paling mudah diadopsi oleh usaha kecil di sekitar Anda untuk mempermudah proses bisnisnya?</p>
      `
    },
    {
      title: "Mindset dan Karakter Wirausaha",
      tag: "Pola Pikir",
      body: () => `
        <p>Sebelum masuk ke alat dan strategi, seorang technopreneur perlu membangun pola pikir yang tepat: berani mengambil risiko terukur, tahan terhadap kegagalan, dan terus belajar dari umpan balik pasar.</p>
        <ul>
          <li>Growth mindset vs fixed mindset dalam konteks bisnis.</li>
          <li>Ciri-ciri wirausahawan: proaktif, adaptif, berorientasi solusi.</li>
          <li>Studi kasus singkat tokoh wirausaha yang bangkit dari kegagalan.</li>
        </ul>
      `
    },
    {
      title: "Identifikasi Peluang Usaha & Analisis Pasar",
      tag: "Riset Peluang",
      body: () => `
        <p>Peluang usaha lahir dari masalah nyata di masyarakat. Pertemuan ini melatih mahasiswa membaca kebutuhan pasar sebelum menentukan ide bisnis.</p>
        <ul>
          <li>Teknik observasi masalah (problem hunting).</li>
          <li>Analisis pasar sederhana: ukuran pasar, target, dan kompetitor.</li>
          <li>Validasi awal ide melalui wawancara calon pengguna.</li>
        </ul>
      `
    },
    {
      title: "Design Thinking untuk Inovasi Produk",
      tag: "Inovasi",
      body: () => `
        <p>Design thinking membantu menerjemahkan masalah pengguna menjadi solusi produk yang relevan, melalui lima tahap: empathize, define, ideate, prototype, test.</p>
        <ul>
          <li>Praktik pemetaan empati (empathy map) terhadap calon pengguna.</li>
          <li>Brainstorming ide solusi dan penyaringan ide terbaik.</li>
          <li>Membuat prototipe kasar (low-fidelity) dari ide terpilih.</li>
        </ul>
      `
    },
    {
      title: "Business Model Canvas (BMC)",
      tag: "Model Bisnis",
      body: () => `
        <p>Business Model Canvas memetakan sembilan elemen kunci sebuah bisnis dalam satu lembar, dari value proposition hingga struktur biaya.</p>
        <ul>
          <li>Penjelasan kesembilan blok BMC dan keterkaitannya.</li>
          <li>Latihan menyusun BMC untuk ide bisnis kelompok.</li>
          <li>Kaitan BMC dengan pemanfaatan teknologi pada tiap blok.</li>
        </ul>
      `
    },
    {
      title: "Validasi Ide & Minimum Viable Product (MVP)",
      tag: "Validasi",
      body: () => `
        <p>Sebelum membangun produk secara penuh, ide perlu diuji lewat versi paling sederhana yang tetap memberi nilai bagi pengguna — MVP.</p>
        <ul>
          <li>Prinsip build–measure–learn.</li>
          <li>Contoh MVP tanpa kode: landing page, pre-order, layanan manual di balik layar (concierge MVP).</li>
          <li>Mengukur umpan balik pengguna awal.</li>
        </ul>
      `
    },
    {
      title: "Studi Kasus Startup Teknologi Lokal & Global",
      tag: "Studi Kasus",
      body: () => `
        <p>Menganalisis perjalanan startup nyata untuk memahami pola keberhasilan dan kegagalan dalam penerapan technopreneurship.</p>
        <ul>
          <li>Diskusi kelompok: satu startup lokal dan satu startup global.</li>
          <li>Identifikasi peluang, model bisnis, dan peran teknologi yang digunakan.</li>
          <li>Pelajaran yang bisa diadaptasi untuk ide bisnis mahasiswa.</li>
        </ul>
      `
    },
    {
      title: "Presentasi Ide Bisnis (Ujian Tengah Semester)",
      tag: "Evaluasi Tengah",
      body: () => `
        <p>Mahasiswa mempresentasikan ide bisnis beserta BMC dan hasil validasi awal di depan kelas sebagai evaluasi tengah semester.</p>
        <ul>
          <li>Format presentasi: masalah, solusi, model bisnis, hasil validasi.</li>
          <li>Sesi tanya jawab dan umpan balik dari dosen/rekan sekelas.</li>
        </ul>
      `
    },
    {
      title: "Strategi Pemasaran Digital",
      tag: "Pemasaran",
      body: () => `
        <p>Teknologi memberi usaha kecil akses ke alat pemasaran yang dulu hanya dimiliki perusahaan besar. Pertemuan ini membahas kanal digital yang relevan.</p>
        <ul>
          <li>Media sosial, marketplace, dan search engine sebagai kanal penjualan.</li>
          <li>Dasar-dasar content marketing dan iklan berbayar.</li>
          <li>Mengukur efektivitas kampanye dengan data sederhana.</li>
        </ul>
      `
    },
    {
      title: "Branding & Positioning Produk",
      tag: "Branding",
      body: () => `
        <p>Branding membangun persepsi dan kepercayaan, sedangkan positioning menentukan tempat produk di benak konsumen dibanding kompetitor.</p>
        <ul>
          <li>Elemen identitas merek: nama, logo, nilai, suara merek.</li>
          <li>Menentukan unique selling proposition (USP).</li>
          <li>Studi kasus rebranding usaha kecil yang berhasil naik kelas.</li>
        </ul>
      `
    },
    {
      title: "Manajemen Keuangan & Modal Usaha",
      tag: "Keuangan",
      body: () => `
        <p>Bisnis yang menjanjikan bisa gagal tanpa pengelolaan keuangan yang sehat. Pertemuan ini membahas dasar keuangan untuk usaha rintisan.</p>
        <ul>
          <li>Menghitung modal awal, harga pokok, dan titik impas (break-even point).</li>
          <li>Memisahkan keuangan pribadi dan usaha.</li>
          <li>Pengenalan alat pencatatan keuangan digital sederhana.</li>
        </ul>
      `
    },
    {
      title: "Aspek Legal & Kekayaan Intelektual",
      tag: "Legalitas",
      body: () => `
        <p>Legalitas melindungi usaha sekaligus membangun kepercayaan pelanggan dan mitra. Pertemuan ini mengenalkan dasar hukum bisnis di Indonesia.</p>
        <ul>
          <li>Bentuk badan usaha: perorangan, CV, PT, hingga koperasi.</li>
          <li>Perizinan usaha dasar dan pentingnya kepatuhan.</li>
          <li>Pengenalan hak kekayaan intelektual (merek, hak cipta, paten sederhana).</li>
        </ul>
      `
    },
    {
      title: "Pendanaan Usaha Rintisan",
      tag: "Pendanaan",
      body: () => `
        <p>Setiap tahap pertumbuhan bisnis membutuhkan sumber pendanaan yang berbeda, dari kantong sendiri hingga investor eksternal.</p>
        <ul>
          <li>Bootstrapping vs pendanaan eksternal.</li>
          <li>Mengenal angel investor, venture capital, dan pinjaman usaha mikro.</li>
          <li>Menyusun pitch deck sederhana untuk mencari pendanaan.</li>
        </ul>
      `
    },
    {
      title: "Scaling Up: Bertumbuh dengan Teknologi",
      tag: "Pertumbuhan",
      body: () => `
        <p>Setelah model bisnis terbukti, tantangan berikutnya adalah bertumbuh secara berkelanjutan tanpa kehilangan kualitas dan efisiensi.</p>
        <ul>
          <li>Strategi otomatisasi proses bisnis dengan teknologi.</li>
          <li>Membangun tim dan sistem operasional yang siap tumbuh.</li>
          <li>Menjaga kualitas layanan saat volume pelanggan meningkat.</li>
        </ul>
      `
    },
    {
      title: "Etika Bisnis & Keberlanjutan",
      tag: "Etika & Keberlanjutan",
      body: () => `
        <p>Technopreneur yang bertahan lama umumnya juga memperhatikan dampak sosial, lingkungan, dan etika dalam menjalankan usahanya.</p>
        <ul>
          <li>Prinsip etika bisnis dalam penggunaan data dan teknologi.</li>
          <li>Konsep triple bottom line: profit, people, planet.</li>
          <li>Studi kasus bisnis berkelanjutan yang tetap menguntungkan.</li>
        </ul>
      `
    },
    {
      title: "Presentasi Akhir & Pitching Bisnis (UAS)",
      tag: "Evaluasi Akhir",
      body: () => `
        <p>Puncak perkuliahan: mahasiswa mempresentasikan rencana bisnis technopreneurship secara menyeluruh, dari masalah hingga strategi pertumbuhan.</p>
        <ul>
          <li>Format pitching: masalah, solusi, model bisnis, traksi, kebutuhan dana.</li>
          <li>Penilaian oleh dosen dan/atau panel eksternal.</li>
          <li>Refleksi akhir: pelajaran terpenting sepanjang satu semester.</li>
        </ul>
      `
    }
  ];

  const STORAGE_KEY = 'technopreneurship_progress_v1';
  let done = {};
  try {
    done = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch (e) {
    done = {};
  }

  let current = 0;

  const roadmapEl = document.getElementById('roadmap');
  const pageEl = document.getElementById('page');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const sidebar = document.getElementById('sidebar');
  const mobileToggle = document.getElementById('mobileToggle');

  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(done)); }
    catch (e) { /* storage unavailable, ignore */ }
  }

  function renderRoadmap() {
    roadmapEl.innerHTML = '';
    MEETINGS.forEach((m, i) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'node-btn' + (i === current ? ' active' : '') + (done[i] ? ' done' : '');
      btn.innerHTML = `
        <span class="node-marker" data-num="${i + 1}">${i + 1}</span>
        <span class="node-text">Pertemuan ${i + 1}<span class="node-tag">${m.title}</span></span>
      `;
      btn.addEventListener('click', () => { current = i; render(); });
      li.appendChild(btn);
      roadmapEl.appendChild(li);
    });
    const total = MEETINGS.length;
    const count = Object.values(done).filter(Boolean).length;
    progressFill.style.width = (count / total * 100) + '%';
    progressText.textContent = count + ' / ' + total;
  }

  function renderPage() {
    const m = MEETINGS[current];
    const isDone = !!done[current];
    pageEl.innerHTML = `
      <p class="page-eyebrow">Pertemuan ${current + 1} — ${m.tag}</p>
      <h1 class="page-title">${m.title}</h1>
      <div class="page-body">${m.body()}</div>
      <div class="toggle-row">
        <button class="done-toggle ${isDone ? 'is-done' : ''}" id="doneBtn">
          <span class="checkbox-dot">${isDone ? '✓' : ''}</span>
          ${isDone ? 'Sudah dipelajari' : 'Tandai sudah dipelajari'}
        </button>
        <div class="nav-arrows">
          <button class="nav-btn" id="prevBtn" ${current === 0 ? 'disabled' : ''}>← Sebelumnya</button>
          <button class="nav-btn" id="nextBtn" ${current === MEETINGS.length - 1 ? 'disabled' : ''}>Berikutnya →</button>
        </div>
      </div>
    `;
    document.getElementById('doneBtn').addEventListener('click', () => {
      done[current] = !done[current];
      saveProgress();
      render();
    });
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (current > 0) { current--; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (current < MEETINGS.length - 1) { current++; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    });
  }

  function render() {
    renderRoadmap();
    renderPage();
  }

  mobileToggle.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
  });

  render();
})();
</script>
</body>
</html>
